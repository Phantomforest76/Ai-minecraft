<!doctype html>
<html lang="en" class="h-full w-full overflow-hidden select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Minecraft Java Edition Web</title>
    <meta name="description" content="A performant voxel sandbox inspired by Minecraft Java Edition featuring procedural chunk generation, 3D animated mobs, delta-normalized physics, manual Nether portal construction, synthesized sound effects, and an authentic Java HUD." />
    <meta property="og:title" content="Minecraft Java Edition Web" />
    <meta property="og:description" content="A performant voxel sandbox inspired by Minecraft Java Edition featuring procedural chunk generation, 3D animated mobs, delta-normalized physics, manual Nether portal construction, synthesized sound effects, and an authentic Java HUD." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      }
      .font-minecraft {
        font-family: 'Press Start 2P', monospace;
      }
      .font-minecraft-mono {
        font-family: 'VT323', monospace;
      }
      .pixelated {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Custom crosshair */
      .crosshair-blend {
        mix-blend-mode: difference;
      }
    </style>
  </head>
  <body class="h-full w-full overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
